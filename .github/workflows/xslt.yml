name: Generate site

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up saxon
        run: |
          wget -P /tmp/saxon https://github.com/Saxonica/Saxon-HE/releases/download/SaxonHE12-9/SaxonHE12-9J.zip
          unzip -d /tmp/saxon /tmp/saxon/SaxonHE12-9J.zip

      - name: Update contents
        run: | 
          git pull origin master
          rm -rf ./docs/*
      
      - name: Build XSLT to HTML and copy static resources
        run: | 
          java -jar /tmp/saxon/saxon-he-12.9.jar -xsl:src/main.xsl -s:src/data/posts.xml -ext:on
          cp src/global.css docs/global.css

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add ./docs/ -f
          git commit -m "Update website docs" || echo "No changes"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
